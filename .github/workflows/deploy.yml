name: Deploy

# Deploys the production stack in the project folder of the self-hosted runner.
# Setup instructions: docs/DEPLOYMENT.md

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a new one waits for the current one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE: docker compose -f docker-compose.prod.yaml

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          # Keeps the environment files, which are not part of the repository.
          clean: false

      - name: Create environment files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f src/.env ]; then
            sed -e 's/^APP_ENV=.*/APP_ENV=production/' -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
              src/.env.example > src/.env
          fi
          # The key must be saved in src/.env, since the image is rebuilt on every deployment.
          if ! grep -q '^APP_KEY=base64:' src/.env; then
            key="base64:$(head -c 32 /dev/urandom | base64)"
            sed "s#^APP_KEY=.*#APP_KEY=$key#" src/.env > src/.env.tmp
            mv src/.env.tmp src/.env
          fi
          chmod 600 .env src/.env

      - name: Build images
        run: $COMPOSE build

      - name: Start containers
        run: $COMPOSE up -d --remove-orphans

      - name: Run database migrations
        run: |
          # The database may take a few seconds to accept connections after it starts.
          for attempt in $(seq 1 20); do
            if $COMPOSE exec -T app php artisan migrate --force; then
              exit 0
            fi
            echo "Waiting for the database ($attempt/20)..."
            sleep 5
          done
          exit 1

      - name: Load initial data on the first deployment
        run: |
          users=$($COMPOSE exec -T app php artisan tinker --execute='echo App\Models\User::count();' | tr -dc '0-9')
          if [ "$users" = "0" ]; then
            $COMPOSE exec -T app php artisan db:seed --force
          fi

      - name: Cache configuration, routes and views
        run: $COMPOSE exec -T app php artisan optimize

      - name: Remove unused images
        run: docker image prune -f
