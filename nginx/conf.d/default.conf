server {
  listen 80;
  server_name _;
  root /var/www/html/public;
  index index.php;

  error_log /var/log/nginx/error.log;
  access_log /var/log/nginx/access.log;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    resolver 127.0.0.11 valid=30s; # Use Docker's internal DNS to resolve container names
    set $php_app_address app:9000; # Assign to a variable so Nginx doesn't crash if 'app' is not ready at startup

    fastcgi_pass $php_app_address; # Using a variable forces dynamic DNS lookup on every request too
    fastcgi_index index.php;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }

  location ~ /\. {
    deny all;
  }
}